<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1570" role="img" aria-labelledby="title desc">
  <title id="title">Mobile view: Angular, Keycloak and application authorization flow</title>
  <desc id="desc">The Angular application uses the AngularJS library and signs in through Keycloak. Keycloak returns a JWT with custom claims. Spring Security validates the bearer token and checks local users and permissions in the application database.</desc>
  <defs>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#222338"/><stop offset="1" stop-color="#191a29"/></linearGradient>
    <linearGradient id="client" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1b373a"/><stop offset="1" stop-color="#202b3b"/></linearGradient>
    <linearGradient id="keycloak" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#163d3c"/><stop offset="1" stop-color="#202d3c"/></linearGradient>
    <linearGradient id="server" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#26364a"/><stop offset="1" stop-color="#202333"/></linearGradient>
    <linearGradient id="db" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#34324a"/><stop offset="1" stop-color="#23243a"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10z" fill="#06f481"/></marker>
    <marker id="arrow-soft" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10z" fill="#9295b0"/></marker>
  </defs>
  <rect width="600" height="1570" rx="22" fill="#171725"/>
  <circle cx="540" cy="125" r="170" fill="#02aaa4" opacity=".045"/>
  <text x="32" y="49" fill="#06f481" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">ONE IDENTITY · ONE CLIENT</text>
  <text x="32" y="82" fill="#f4f4f8" font-family="Arial,sans-serif" font-size="21" font-weight="700">Sign in once. Authorize with app data.</text>
  <text x="32" y="112" fill="#9a9cb2" font-family="Arial,sans-serif" font-size="10" letter-spacing="1.2">OIDC · JWT · LOCAL AUTHZ</text>

  <!-- Frontends -->
  <rect x="28" y="145" width="544" height="246" rx="17" fill="url(#back)" stroke="#6d718a" stroke-opacity=".42"/>
  <text x="51" y="179" fill="#8c91a9" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">01 · FRONTEND</text>
  <rect x="49" y="197" width="502" height="73" rx="12" fill="url(#client)" stroke="#06f481" stroke-opacity=".48"/>
  <rect x="66" y="216" width="34" height="34" rx="9" fill="#06f481" fill-opacity=".13"/>
  <path d="M74 226h18M74 233h18M74 240h12" stroke="#06f481" stroke-width="2" stroke-linecap="round"/>
  <text x="116" y="229" fill="#f4f4f8" font-family="Arial,sans-serif" font-size="18" font-weight="700">Angular</text>
  <text x="116" y="249" fill="#aeb0c2" font-family="Arial,sans-serif" font-size="11">Single-page application</text>
  <text x="81" y="318" fill="#c0c1cf" font-family="Arial,sans-serif" font-size="12">Uses the AngularJS library.</text>
  <text x="81" y="345" fill="#02aaa4" font-family="Arial,sans-serif" font-size="9" font-weight="700" letter-spacing="1">OIDC CLIENT · KEYCLOAK</text>

  <!-- OIDC handoff -->
  <path d="M300 391V442" fill="none" stroke="#06f481" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="170" y="403" width="260" height="27" rx="13" fill="#171725" stroke="#06f481" stroke-opacity=".34"/>
  <text x="300" y="421" text-anchor="middle" fill="#b8f9d8" font-family="Arial,sans-serif" font-size="10" font-weight="700">AUTHORIZATION CODE + PKCE</text>

  <!-- Keycloak -->
  <rect x="28" y="452" width="544" height="252" rx="17" fill="url(#keycloak)" stroke="#06f481" stroke-opacity=".55"/>
  <text x="51" y="487" fill="#06f481" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">02 · IDENTITY PROVIDER</text>
  <circle cx="113" cy="557" r="34" fill="#06f481" fill-opacity=".1" stroke="#06f481" stroke-opacity=".4"/>
  <path d="M98 563v-14l15-9 15 9v14l-15 8z" fill="none" stroke="#06f481" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="113" cy="556" r="4" fill="#06f481"/>
  <text x="164" y="553" fill="#f4f4f8" font-family="Arial,sans-serif" font-size="25" font-weight="700">Keycloak</text>
  <text x="164" y="578" fill="#c4c6d4" font-family="Arial,sans-serif" font-size="12">OIDC · MFA policy</text>
  <rect x="51" y="613" width="498" height="61" rx="10" fill="#111d27" fill-opacity=".72" stroke="#06f481" stroke-opacity=".33"/>
  <text x="70" y="638" fill="#8fbea9" font-family="Arial,sans-serif" font-size="9" font-weight="700" letter-spacing="1.2">SIGNED TOKENS RETURN TO THE CLIENTS</text>
  <text x="70" y="660" fill="#f4f4f8" font-family="monospace" font-size="13">JWT · access token · custom claims</text>

  <!-- API request -->
  <path d="M300 704V755" fill="none" stroke="#06f481" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="197" y="716" width="206" height="27" rx="13" fill="#171725" stroke="#06f481" stroke-opacity=".34"/>
  <text x="300" y="734" text-anchor="middle" fill="#b8f9d8" font-family="Arial,sans-serif" font-size="10" font-weight="700">API REQUEST · BEARER JWT</text>

  <!-- Spring Security -->
  <rect x="28" y="765" width="544" height="290" rx="17" fill="url(#server)" stroke="#7e9fc0" stroke-opacity=".45"/>
  <text x="51" y="800" fill="#a6c4e5" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">03 · RESOURCE SERVER</text>
  <text x="51" y="842" fill="#f4f4f8" font-family="Arial,sans-serif" font-size="24" font-weight="700">Spring Security</text>
  <text x="51" y="866" fill="#b3b7c8" font-family="Arial,sans-serif" font-size="12">Validates bearer JWT, issuer, signature &amp; audience</text>
  <path d="M51 887H549" stroke="#a6c4e5" stroke-opacity=".23"/>
  <rect x="51" y="906" width="498" height="55" rx="10" fill="#18202e" stroke="#82a9d1" stroke-opacity=".35"/>
  <text x="70" y="930" fill="#9db6d4" font-family="Arial,sans-serif" font-size="9" font-weight="700" letter-spacing="1.1">APPLICATION API</text>
  <text x="70" y="949" fill="#f4f4f8" font-family="Arial,sans-serif" font-size="13" font-weight="700">Protected endpoints</text>
  <rect x="51" y="978" width="498" height="54" rx="10" fill="#15352f" stroke="#06f481" stroke-opacity=".42"/>
  <path d="M70 1004l7 7 14-16" fill="none" stroke="#06f481" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="107" y="1003" fill="#e8f8f0" font-family="Arial,sans-serif" font-size="12" font-weight="700">Checks local user + permissions</text>
  <text x="107" y="1022" fill="#aeb0c2" font-family="Arial,sans-serif" font-size="10">Decides whether the request is authorized</text>

  <!-- Local authorization data -->
  <path d="M300 1055V1106" fill="none" stroke="#c0a5ff" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="171" y="1067" width="258" height="27" rx="13" fill="#171725" stroke="#c0a5ff" stroke-opacity=".35"/>
  <text x="300" y="1085" text-anchor="middle" fill="#d7c9fb" font-family="Arial,sans-serif" font-size="10" font-weight="700">LOOK UP USER + PERMISSIONS</text>
  <path d="M430 1120V1074" fill="none" stroke="#9295b0" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow-soft)"/>
  <text x="449" y="1091" fill="#9fa1b7" font-family="Arial,sans-serif" font-size="9">local permissions</text>

  <rect x="28" y="1116" width="544" height="248" rx="17" fill="url(#db)" stroke="#ae9ae0" stroke-opacity=".4"/>
  <text x="51" y="1151" fill="#c6b5ee" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">04 · APPLICATION DATA</text>
  <ellipse cx="100" cy="1222" rx="37" ry="14" fill="#4a4162" stroke="#c0a5ff" stroke-opacity=".72"/>
  <path d="M63 1222v39c0 8 17 15 37 15s37-7 37-15v-39M63 1242c0 8 17 15 37 15s37-7 37-15" fill="none" stroke="#c0a5ff" stroke-opacity=".72" stroke-width="2"/>
  <text x="159" y="1225" fill="#f4f4f8" font-family="Arial,sans-serif" font-size="20" font-weight="700">Application DB</text>
  <text x="159" y="1249" fill="#b9b2ce" font-family="Arial,sans-serif" font-size="12">Owns users &amp; authorization data</text>
  <rect x="51" y="1290" width="498" height="51" rx="9" fill="#171725" stroke="#c0a5ff" stroke-opacity=".25"/>
  <text x="70" y="1312" fill="#c0a5ff" font-family="monospace" font-size="12">email</text>
  <text x="121" y="1312" fill="#aeb0c2" font-family="Arial,sans-serif" font-size="11">→ local user</text>
  <text x="70" y="1331" fill="#aeb0c2" font-family="Arial,sans-serif" font-size="10">groups · roles · permissions</text>

  <rect x="28" y="1390" width="544" height="117" rx="14" fill="#202033" stroke="#777a95" stroke-opacity=".2"/>
  <text x="51" y="1425" fill="#06f481" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.3">CLEAR RESPONSIBILITY BOUNDARY</text>
  <text x="51" y="1454" fill="#e4e4ed" font-family="Arial,sans-serif" font-size="13">Keycloak authenticates and issues claims.</text>
  <text x="51" y="1476" fill="#e4e4ed" font-family="Arial,sans-serif" font-size="13">The app DB supplies users and permissions.</text>
  <rect x="51" y="1488" width="189" height="1" fill="#06f481" opacity=".45"/>
  <text x="51" y="1523" fill="#8cf8bb" font-family="monospace" font-size="12">ALLOW 200 · DENY 403</text>
</svg>
